<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Match the saved UI language before React loads, so the page doesn't flip direction on reload.
      try {
        if (localStorage.getItem("appLanguage") === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
      } catch (e) {}
      // Same for the theme (see src/utils/theme.js): the saved "emerald", otherwise "mali".
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("appTheme") === "emerald" ? "emerald" : "mali";
      } catch (e) {
        document.documentElement.dataset.theme = "mali";
      }
    </script>
    <style>
      .boot-loader { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
      .boot-loader span { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #cbd5e1; border-top-color: #334155; animation: boot-spin 0.8s linear infinite; }
      [data-theme="emerald"] .boot-loader span { border-color: #e2e8f0; border-top-color: #1e2a38; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader" role="status"><span></span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
